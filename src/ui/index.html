<!-- ZMarkdown window contents. Nim assembles the final document by inlining the
     stylesheet (with embedded fonts) and the script, so the running page makes
     no network requests. The STYLE and SCRIPT markers below are where Nim
     splices those in. -->
<div id="app" data-view="split">
  <div id="toolbar">
    <span class="wordmark"><span class="z">Z</span>Markdown</span>

    <div class="tb-sep"></div>

    <div class="menu-wrap">
      <button id="btn-file" aria-haspopup="true" aria-expanded="false">File</button>
      <div id="file-menu" class="menu" role="menu">
        <button data-action="new" role="menuitem">New<span class="accel">Ctrl+N</span></button>
        <button data-action="open" role="menuitem">Open<span class="accel">Ctrl+O</span></button>
        <button data-action="save" role="menuitem">Save<span class="accel">Ctrl+S</span></button>
        <button data-action="save-as" role="menuitem">Save As<span class="accel">Ctrl+Shift+S</span></button>
        <div class="menu-sep"></div>
        <button data-action="settings" role="menuitem">Settings</button>
        <div class="menu-sep"></div>
        <button data-action="exit" role="menuitem">Exit</button>
      </div>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" role="group" aria-label="History">
      <button class="icon" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
      </button>
      <button class="icon" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 7 5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" role="group" aria-label="Formatting">
      <button class="icon" id="btn-bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
      <button class="icon" id="btn-italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
      <button class="icon" id="btn-underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
      <button class="icon" id="btn-link" title="Insert link" aria-label="Insert link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>
      </button>
      <button class="icon" id="btn-image" title="Insert image" aria-label="Insert image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" role="group" aria-label="Find">
      <button class="icon" id="btn-find" title="Find (Ctrl+F)" aria-label="Find">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="viewmodes" role="group" aria-label="View mode">
      <button data-view="text" id="vm-text" title="Text only">Text</button>
      <button data-view="split" id="vm-split" title="Split view" class="active">Split</button>
      <button data-view="preview" id="vm-preview" title="Preview only">Preview</button>
    </div>

    <div class="tb-spacer"></div>
    <span class="doc-title" id="doc-title">Untitled</span>
  </div>

  <!-- Find / replace. Docked under the toolbar so it never covers the text it
       is searching. The replace row is revealed by the twisty (or Ctrl+H). -->
  <div id="findbar" hidden role="search" aria-label="Find and replace">
    <button class="icon twisty" id="find-expand" title="Toggle replace (Ctrl+H)"
            aria-label="Toggle replace" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="find-rows">
      <div class="find-row">
        <div class="find-field">
          <input id="find-input" type="text" placeholder="Find" spellcheck="false"
                 autocomplete="off" aria-label="Find">
          <span class="find-count" id="find-count" aria-live="polite"></span>
        </div>
        <div class="tb-group">
          <button class="icon" id="find-prev" title="Previous match (Shift+Enter)" aria-label="Previous match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
          </button>
          <button class="icon" id="find-next" title="Next match (Enter)" aria-label="Next match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <div class="tb-group">
          <button class="icon toggle" id="find-case" title="Match case"
                  aria-label="Match case" aria-pressed="false">Aa</button>
          <button class="icon toggle" id="find-word" title="Whole word"
                  aria-label="Whole word" aria-pressed="false"><span class="ww">ab</span></button>
        </div>
        <span class="find-note" id="find-note"></span>
        <div class="tb-spacer"></div>
        <button class="icon" id="find-close" title="Close (Esc)" aria-label="Close find">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="find-row" id="find-replace-row" hidden>
        <div class="find-field">
          <input id="replace-input" type="text" placeholder="Replace with"
                 spellcheck="false" autocomplete="off" aria-label="Replace with">
        </div>
        <button id="replace-one" class="wide">Replace</button>
        <button id="replace-all" class="wide">Replace All</button>
      </div>
    </div>
  </div>

  <div id="panes">
    <div id="editor-pane" class="pane">
      <!-- The highlight layer mirrors the textarea's text and typography behind
           it, so every match can be marked; the textarea itself sits on top,
           transparent, and keeps the caret and real text. -->
      <div id="editor-stack">
        <div id="editor-highlights" aria-hidden="true"><div class="hl-inner"></div></div>
        <textarea id="editor" spellcheck="false" placeholder="Write markdown here..."></textarea>
      </div>
    </div>
    <div id="divider" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize panes (arrow keys)"></div>
    <div id="preview-pane" class="pane">
      <div id="preview"><div class="reading" id="reading"></div></div>
    </div>
  </div>

  <div id="settings-overlay" hidden>
    <div id="settings-dialog" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="dlg-head">Settings</div>
      <div class="dlg-row">
        <label for="set-font">Font</label>
        <select id="set-font">
          <option value="">Default (serif preview, mono editor)</option>
          <option value="serif4">Source Serif 4</option>
          <option value="plex">IBM Plex Mono</option>
          <option value="sans">System sans-serif</option>
          <option value="sysserif">System serif</option>
          <option value="mono">System monospace</option>
        </select>
      </div>
      <div class="dlg-row">
        <label for="set-fg">Font color</label>
        <input type="color" id="set-fg" value="#1A1D24">
      </div>
      <div class="dlg-row">
        <label for="set-bg">Background color</label>
        <input type="color" id="set-bg" value="#EDEBE4">
      </div>
      <div class="dlg-note">Applies to both the editor and the preview.</div>
      <div class="dlg-buttons">
        <button id="set-reset" type="button">Reset to defaults</button>
        <button id="set-close" type="button" class="primary">Close</button>
      </div>
    </div>
  </div>

  <div id="autoscroll-marker" aria-hidden="true">
    <svg viewBox="0 0 40 40">
      <circle class="ring" cx="20" cy="20" r="15"/>
      <circle class="dot" cx="20" cy="20" r="2.2"/>
      <path class="arr" d="M20 5 l4 5 h-8 z"/>
      <path class="arr" d="M20 35 l4 -5 h-8 z"/>
      <path class="arr" d="M5 20 l5 4 v-8 z"/>
      <path class="arr" d="M35 20 l-5 4 v-8 z"/>
    </svg>
  </div>
</div>
